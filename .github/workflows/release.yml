name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      # Tauri 依赖 WebKitGTK / GTK，ubuntu-latest 镜像里没有，
      # 不装这些系统库，cargo 会在编译 wry（WebView 绑定）时直接失败。
      # 对应关系：
      #   libwebkit2gtk-4.1-dev  → webkit2gtk-4.1 >= 2.4
      #   libgtk-3-dev          → gtk+-3.0
      #   libsoup-3.0-dev       → libsoup-3.0
      #   libjavascriptcoregtk-4.1-dev → javascriptcoregtk-4.1
      #   libayatana-appindicator3-dev  → 托盘图标（运行时动态加载）
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Validate quote corpus
        run: python3 scripts/validate_quotes.py

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon)
          - name: macos-arm64
            platform: macos-15
            target: aarch64-apple-darwin
          # macOS x64 (Intel)
          # 在 arm64 runner 上交叉编译。macos-14 已于 2026-11-02 退役，
          # 而 macOS 15 的 x64 变体是付费的 macos-15-intel，
          # 公开 runner 里只有 arm64，所以 x64 走交叉编译。
          - name: macos-x64
            platform: macos-15
            target: x86_64-apple-darwin
          # Windows x64
          - name: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          # Windows x86 (32-bit)
          - name: windows-x86
            platform: windows-latest
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (${{ matrix.target }})
        run: npx tauri build --target ${{ matrix.target }}

      # .app 是目录，upload-artifact 传目录会把里面的文件平铺开，
      # .app 就没了。所以在 macOS runner 上先压成 zip 再传。
      # 用 ditto 而不是 zip：它会保留 UTF-8 文件名标记和符号链接，
      # 中文书名「拾遗.app」才不会在别的平台解出乱码。
      - name: Archive macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$app" ] || { echo "没有找到 .app"; exit 1; }
          dir="$(dirname "$app")"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$dir/${{ matrix.name }}.zip"
          echo "archived $dir/${{ matrix.name }}.zip"

      - name: Upload artifacts (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: shiyi-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # 不合并目录：macOS arm64 与 x64 的 .app 同名，合并会互相覆盖。
      # 每个平台保留自己的子目录，发布前再重命名。
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # 各平台产物原样收进发布目录。文件名已带架构，不会重名：
      #   macos-arm64.zip / macos-x64.zip
      #   拾遗_0.1.0_aarch64.dmg / 拾遗_0.1.0_x64.dmg
      #   拾遗_0.1.0_x64-setup.exe / 拾遗_0.1.0_x86-setup.exe
      #   拾遗_0.1.0_x64_en-US.msi / 拾遗_0.1.0_x86_en-US.msi
      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p packaged
          find dist -type f \( -name '*.zip' -o -name '*.dmg' \
                            -o -name '*.exe' -o -name '*.msi' \) \
            -exec cp {} packaged/ \;
          ls -la packaged/

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: packaged/**
          generate_release_notes: true
